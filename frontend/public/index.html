<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品價格追蹤</title>
  <style>
    :root { --bg:#f4f5f7; --card:#ffffff; --line:#e2e8f0; --text:#1e293b; --muted:#64748b; --accent:#0284c7; --danger:#dc2626; --ok:#059669; --up:#dc2626; --down:#059669; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:20px; }
    .addbar { display:flex; gap:8px; }
    input[type=text]{ flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#f8fafc; color:var(--text); font-size:14px; }
    button { cursor:pointer; border:none; border-radius:8px; padding:10px 14px; font-size:14px; font-weight:600; }
    .btn-add { background:var(--accent); color:#ffffff; }
    .btn-add:disabled { opacity:.6; cursor:default; }
    .btn-del { background:transparent; color:var(--danger); border:1px solid var(--line); padding:6px 10px; }
    table { width:100%; border-collapse: collapse; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); font-size:14px; vertical-align: middle; }
    th:not(:first-child), td:not(:first-child) { text-align: center; }
    th { color:var(--muted); font-weight:600; font-size:12px; letter-spacing:.04em; }
    .name { font-weight:600; max-width:360px; }
    .name a { color:var(--text); text-decoration:none; }
    .name a:hover { color:var(--accent); }
    .price { font-variant-numeric: tabular-nums; font-weight:700; }
    .muted { color:var(--muted); font-size:12px; }
    .up { color:var(--up); } .down { color:var(--down); }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; background:#f1f5f9; border:1px solid var(--line); color:var(--muted); }
    .empty { color:var(--muted); text-align:center; padding:24px; }
    #msg { min-height: 20px; font-size: 13px; margin-top:8px; }
    .err { color: var(--danger); } .ok { color: var(--ok); }
    .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .btn-refresh { background:#f1f5f9; color:var(--accent); border:1px solid var(--line); padding:6px 10px; }
    .ver { text-align:center; color:var(--muted); font-size:12px; margin-top:24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🛒 商品價格追蹤</h1>
    <div class="sub">後端每小時自動比對前一小時價格，有變動透過 Telegram 通知。此頁面僅負責新增、檢視與刪除。</div>

    <div class="card">
      <div class="addbar">
        <input id="url" type="text" placeholder="貼上商品網址（momo / PChome / 蝦皮）…" />
        <button id="addBtn" class="btn-add">新增追蹤</button>
      </div>
      <div id="msg"></div>
    </div>

    <div class="card">
      <div class="toolbar">
        <span class="muted">追蹤清單</span>
        <button id="refreshBtn" class="btn-refresh">重新整理</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>商品</th>
            <th>站別</th>
            <th>現價</th>
            <th>前一次</th>
            <th>最後檢查</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none;">尚無追蹤商品</div>
    </div>

    <footer id="ver" class="ver">版本載入中…</footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
